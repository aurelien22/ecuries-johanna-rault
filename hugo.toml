[params]
name = "Aurélien D."
subtitle = "Une écurie familliale dédiée au bien-être du cheval à Hénansal près de Lamballe"
subtitleText = "Profiter d'un lieu calme et apaisant pour profiter de votre passion à 15 minutes de la plage 🌊. En week-end ou en vacances avec votre cheval, nous pouvons également vous accueillir sur des courtes durées. "
motGerante = "Titulaire d’un galop 7 et d’un BTS Productions Animales Option Équitation, j’ai ouvert cette écurie pour offrir à chaque cheval une attention personnalisée dans un cadre convivial et naturel. Ici, la priorité est donnée à la mobilité, au bien-être et à l’écoute des besoins de chaque équidé, quelle que soit sa discipline ou son âge. Formée aux soins et à la thalassotérapie par Jennifer Bouyou à Fréhel, je saurais vous apporter mes conseils. Présente 7 jours sur 7, je veille à ce que chaque pensionnaire profite d’un environnement sain, de sorties quotidiennes au paddock et d’une alimentation de qualité, issue de prairies naturelles non traitées. Rejoignez une écurie où l’ambiance est décontractée, mais où le sérieux et la passion guident chaque décision."