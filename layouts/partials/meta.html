<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta
  name="description"
  content="Découvrez une écurie conviviale en Bretagne, dédiée au bien-être du cheval et à l’accompagnement des cavaliers. Visite et réservation sur simple demande."
>
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<title>{{ .Page.Title }}</title>
{{ with resources.Get "sass/main.scss" }}
  {{ $style := . | css.Sass | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">
{{ end }}
{{ with resources.Get "fonts/fontmaison.woff2" }}
<link rel="preload" href="{{ .RelPermalink }}" as="font" type="font/woff2" crossorigin>
{{ end }}
